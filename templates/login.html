<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
</head>
<body>

    <h1>Login</h1>

    {% if hasError %}
        <p>
            Credenziali non valide
        </p>
    {% endif %}

    <form method="POST">

        <label>Username</label>
        <input
            type="text"
            name="username"
            required
        >

        <br><br>

        <label>Password</label>
        <input
            type="password"
            name="password"
            required
        >

        <br><br>

        <button type="submit">
            Accedi
        </button>

    </form>

    <br>

    <a href="/auth/register">
        Registrati
    </a>

</body>
</html>
