<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ricerca meteo</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light min-vh-100 d-flex flex-column">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{{ url_for('weather.search') }}">
                <i class="fa-solid fa-cloud-sun me-2"></i>App Meteo
            </a>
            <div class="d-flex align-items-center gap-3">
                <a class="btn btn-outline-light btn-sm" href="{{ url_for('favourites.favourites') }}">
                    <i class="fa-solid fa-star me-1"></i> Preferiti
                </a>
                <a class="btn btn-light btn-sm text-primary" href="{{ url_for('auth.logout') }}">
                    <i class="fa-solid fa-right-from-bracket me-1"></i> Logout
                </a>
            </div>
        </div>
    </nav>

    <div class="container my-auto py-4">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">

                <div class="card shadow-sm border-0 p-4">
                    <div class="text-center mb-4">
                        <h2 class="fw-bold">Ricerca Meteo</h2>
                        <p class="text-muted mb-0">Benvenuto, <strong>{{ current_user.username }}</strong>!</p>
                    </div>

                    {% if error %}
                        <div class="alert alert-danger text-center" role="alert">
                            {{ error }}
                        </div>
                    {% endif %}

                    <form action="{{ url_for('weather.weather') }}" method="GET" class="position-relative">
                        <div class="input-group input-group-lg">
                            <span class="input-group-text bg-white"><i class="fa-solid fa-magnifying-glass text-muted"></i></span>
                            <input
                                type="text"
                                id="city"
                                name="city"
                                class="form-control border-start-0"
                                autocomplete="off"
                                placeholder="Inserisci una città..."
                                required
                            >
                            <button type="submit" class="btn btn-primary">
                                Cerca
                            </button>
                        </div>

                        <input type="hidden" id="latitude" name="latitude">
                        <input type="hidden" id="longitude" name="longitude">

                        <!-- Dropdown Suggerimenti con stili di Bootstrap -->
                        <div id="suggestions" class="list-group position-absolute w-100 shadow-sm mt-1 z-3" style="max-height: 250px; overflow-y: auto;"></div>
                    </form>

                    <div class="text-center mt-4">
                        <a href="{{ url_for('favourites.favourites') }}" class="text-decoration-none text-secondary">
                            <i class="fa-solid fa-star text-warning me-1"></i> Le mie città preferite
                        </a>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        const cityInput = document.getElementById("city");
        const suggestions = document.getElementById("suggestions");

        cityInput.addEventListener("input", async () => {
            const query = cityInput.value;

            if (query.length < 2) {
                suggestions.innerHTML = "";
                return;
            }

            const response = await fetch(
                `/autocomplete?q=${encodeURIComponent(query)}`
            );

            const cities = await response.json();
            suggestions.innerHTML = "";

            cities.forEach(city => {
                const item = document.createElement("button");
                item.type = "button";
                item.classList.add("list-group-item", "list-group-item-action");
                item.innerText = `${city.name}, ${city.admin1}, ${city.country}`;

                item.addEventListener("click", () => {
                    cityInput.value = `${city.name}, ${city.country}`;
                    document.getElementById("latitude").value = city.latitude;
                    document.getElementById("longitude").value = city.longitude;
                    suggestions.innerHTML = "";
                });

                suggestions.appendChild(item);
            });
        });
    </script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
