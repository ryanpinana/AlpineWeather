<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le mie città preferite</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>

<body class="bg-light min-vh-100 d-flex flex-column">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{{ url_for('weather.search') }}">
                <i class="fa-solid fa-cloud-sun me-2"></i>App Meteo
            </a>
            <div class="d-flex gap-2">
                <a class="btn btn-outline-light btn-sm" href="{{ url_for('weather.search') }}">
                    <i class="fa-solid fa-magnifying-glass me-1"></i> Ricerca
                </a>
                <a class="btn btn-light btn-sm text-primary" href="{{ url_for('auth.logout') }}">
                    <i class="fa-solid fa-right-from-bracket me-1"></i> Logout
                </a>
            </div>
        </div>
    </nav>

    <div class="container my-auto py-4">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">

                <div class="card shadow-sm border-0">
                    <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                        <h3 class="h5 mb-0 fw-bold">
                            <i class="fa-solid fa-star text-warning me-2"></i>Le mie città preferite
                        </h3>
                    </div>

                    <div class="card-body p-0">
                        {% if cities %}
                            <div class="list-group list-group-flush">
                                {% for city in cities %}
                                    <div class="list-group-item d-flex justify-content-between align-items-center p-3">
                                        <span class="fw-semibold text-dark fs-5">
                                            <i class="fa-solid fa-location-dot text-primary me-2"></i>{{ city.city_name }}
                                        </span>
                                        <div class="btn-group" role="group">
                                            <a href="{{ url_for('weather.weather', city=city.city_name) }}" class="btn btn-outline-primary btn-sm">
                                                <i class="fa-solid fa-magnifying-glass me-1"></i> Meteo
                                            </a>
                                            <a href="{{ url_for('favourites.delete_favourite', id=city.id) }}" class="btn btn-outline-danger btn-sm">
                                                <i class="fa-solid fa-trash me-1"></i> Elimina
                                            </a>
                                        </div>
                                    </div>
                                {% endfor %}
                            </div>
                        {% else %}
                            <div class="p-4 text-center text-muted">
                                <i class="fa-solid fa-folder-open fa-2x mb-2 d-block"></i>
                                Nessuna città trovata nei preferiti.
                            </div>
                        {% endif %}
                    </div>

                    <div class="card-footer bg-white border-top-0 p-3">
                        <a href="{{ url_for('weather.search') }}" class="btn btn-link text-decoration-none p-0">
                            <i class="fa-solid fa-arrow-left me-1"></i> Torna alla ricerca
                        </a>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
